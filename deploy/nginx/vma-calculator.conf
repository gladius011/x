upstream vma_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name vma.maryamkarim.com;

    root /var/www/vma-calculator/current/frontend/dist;
    index index.html;

    access_log /var/log/nginx/vma-calculator.access.log;
    error_log  /var/log/nginx/vma-calculator.error.log warn;

    # Cloudflare already terminates TLS. Enforce only Cloudflare IPs if desired.
    set $cf_scheme $http_cf_visitor;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Serve built SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check surfaces backend readiness
    location = /healthz {
        proxy_pass http://vma_api/api/health;
    }

    # API routes proxy to Express
    location /api/ {
        proxy_http_version 1.1;
        proxy_pass http://vma_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
    }

    # Deny direct access to hidden files
    location ~ /\. {
        deny all;
    }
}
